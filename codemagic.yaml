workflows:
  android-workflow:
    name: Build Android APK
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Install and Switch to Gradle 9.3.1
        script: |
          wget https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -P /tmp
          sudo unzip -d /opt/gradle /tmp/gradle-9.3.1-bin.zip
          export PATH=/opt/gradle/gradle-9.3.1/bin:$PATH
          echo "export PATH=/opt/gradle/gradle-9.3.1/bin:\$PATH" >> ~/.bash_profile
      - name: Build APK with New Gradle
        script: |
          export PATH=/opt/gradle/gradle-9.3.1/bin:$PATH
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
